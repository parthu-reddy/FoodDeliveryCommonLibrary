name: Publish to GitHub Packages

# Manual only, matching the platform-wide decision that no pipeline runs on its own.
on:
  workflow_dispatch:

jobs:

  # Deletes the previous 1.0-SNAPSHOT version BEFORE publishing, not after.
  #
  # GitHub models a Maven SNAPSHOT as a single version: every `mvn deploy` adds another set of
  # timestamped files inside `1.0-SNAPSHOT` rather than creating a new version. So a
  # keep-the-latest-N prune deletes nothing, ever, while the files inside that one version keep
  # accumulating -- actions/delete-package-versions#71. Wiping the version first and republishing
  # keeps storage flat at roughly one publish's worth.
  #
  # continue-on-error because the first ever publish has no package to delete, and a fresh repo must
  # not be blocked by that.
  prune:
    name: Wipe the previous snapshot
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - common-library
          - common-core
          - common-persistence
          - common-messaging
          - common-web
          - common-storage
          - common-test
    steps:
      # Deletes the PACKAGE, not a version. GitHub refuses to delete the last version of a package
      # ("You must delete the package instead"), and a Maven SNAPSHOT only ever has one version --
      # every deploy adds timestamped files inside 1.0-SNAPSHOT rather than creating a version. So
      # actions/delete-package-versions cannot prune a snapshot at all, whatever its inputs.
      #
      # The package is recreated by the deploy in the next job. Safe here because these artifacts are
      # snapshot-only; it would also remove release versions if any ever existed.
      - name: Wipe the previous snapshot
        id: wipe
        continue-on-error: true
        env:
          # PACKAGES_TOKEN, not GITHUB_TOKEN. Deleting a package needs admin on the package, which
          # the per-run GITHUB_TOKEN does not carry however the permissions block is written -- its
          # `packages: write` covers publishing, not deletion. The owner granted delete on the
          # classic PACKAGES_TOKEN on 2026-09-13. Publishing still uses GITHUB_TOKEN.
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
        run: |
          gh api --method DELETE \
            "/users/parthu-reddy/packages/maven/com.fooddelivery.${{ matrix.artifact }}"
      # continue-on-error above turns any failure into a green run -- it already hid an
      # "Invalid input combination" error once. Say out loud what happened, so a broken wipe is
      # visible in the log even though it must not block publishing.
      - name: Report the wipe outcome
        run: |
          echo "wipe outcome: ${{ steps.wipe.outcome }}"
          if [ "${{ steps.wipe.outcome }}" != "success" ]; then
            echo "::warning::Snapshot wipe did not succeed. Expected only on a first publish (no package yet); otherwise storage will keep growing."
          fi

  publish:
    name: Deploy the six common-* modules
    needs: prune
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # common-* modules sit under food-delivery-parent and common-web needs identity-signing.
      - name: Checkout Parent POM
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/FoodDeliveryParentPOM
          path: deps/FoodDeliveryParentPOM
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout IdentitySigning
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/IdentitySigning
          path: deps/IdentitySigning
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Install shared dependencies
        run: |
          mvn -q -B -N install -f deps/FoodDeliveryParentPOM/pom.xml
          mvn -q -B install -f deps/IdentitySigning/pom.xml -DskipTests

          # typescript-generator writes into FoodDeliveryAppUI, which is not checked out here.
          mkdir -p deps/FoodDeliveryAppUI/src/types

      # The <id> must be `github`, matching <distributionManagement><repository><id> in the pom.
      # A mismatch fails with a 401 that reads like a permissions problem.
      - name: Write Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <!-- GITHUB_TOKEN, not a PAT. A workflow can publish to its OWN repository's
                     package registry with `permissions: packages: write` above, so this needs no
                     stored secret, is scoped to this repository alone, and expires with the run.
                     CHECKOUT_TOKEN is still used above, but only to check out sibling repos. -->
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      # Tests are not re-run on deploy: they run in this repo's own build, and repeating them makes
      # publishing slower without adding a check that has not already happened.
      - name: Deploy
        run: mvn -B deploy -DskipTests

