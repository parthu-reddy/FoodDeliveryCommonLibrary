name: Publish to GitHub Packages

# Manual only, matching the platform-wide decision that no pipeline runs on its own.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Deploy the six common-* modules
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
          cache: maven

      # common-* modules sit under food-delivery-parent and common-web needs identity-signing.
      - name: Checkout Parent POM
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/FoodDeliveryParentPOM
          path: deps/FoodDeliveryParentPOM
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Checkout IdentitySigning
        uses: actions/checkout@v5
        with:
          repository: parthu-reddy/IdentitySigning
          path: deps/IdentitySigning
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Install shared dependencies
        run: |
          mvn -q -B -N install -f deps/FoodDeliveryParentPOM/pom.xml
          mvn -q -B install -f deps/IdentitySigning/pom.xml -DskipTests

          # typescript-generator writes into FoodDeliveryAppUI, which is not checked out here.
          mkdir -p deps/FoodDeliveryAppUI/src/types

      # The <id> must be `github`, matching <distributionManagement><repository><id> in the pom.
      # A mismatch fails with a 401 that reads like a permissions problem.
      - name: Write Maven credentials
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings>
            <servers>
              <server>
                <id>github</id>
                <username>${{ github.actor }}</username>
                <!-- GITHUB_TOKEN, not a PAT. A workflow can publish to its OWN repository's
                     package registry with `permissions: packages: write` above, so this needs no
                     stored secret, is scoped to this repository alone, and expires with the run.
                     CHECKOUT_TOKEN is still used above, but only to check out sibling repos. -->
                <password>${{ secrets.GITHUB_TOKEN }}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      # Tests are not re-run on deploy: they run in this repo's own build, and repeating them makes
      # publishing slower without adding a check that has not already happened.
      - name: Deploy
        run: mvn -B deploy -DskipTests

  # Keeps the latest 4 versions of each artifact. Every `mvn deploy` of a SNAPSHOT creates a NEW
  # timestamped version rather than replacing the last, and GitHub keeps them all, so storage grows
  # with every publish. Free while this repo is public; counts against the account's 500 MB the
  # moment it goes private, and that quota is shared with Actions artifacts.
  #
  # package-name is singular, so one invocation per artifact. fail-fast is off: a name that does not
  # resolve should not stop the others being pruned, and shows up as one red matrix leg.
  prune:
    name: Keep the latest 4 versions
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        artifact:
          - common-library
          - common-core
          - common-persistence
          - common-messaging
          - common-web
          - common-storage
          - common-test
    steps:
      - name: Prune old versions
        uses: actions/delete-package-versions@v5
        with:
          package-name: com.fooddelivery.${{ matrix.artifact }}
          package-type: maven
          min-versions-to-keep: 4
