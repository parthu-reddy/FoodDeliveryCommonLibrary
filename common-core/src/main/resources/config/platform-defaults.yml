# ---------------------------------------------------------------------------
# Platform-wide configuration defaults.
#
# Shipped inside the common-library jar and pulled in by every service with:
#
#     spring:
#       config:
#         import: optional:classpath:config/platform-defaults.yml, optional:configserver:...
#
# Precedence (Spring Boot config-data rules, measured on Boot 3.3.0 on 2026-10-17 with a
# probe app): an imported document OUTRANKS the document that imports it, and a later
# import outranks an earlier one. Every service imports this file and then the config
# server, so:
#
#     config server (Deployment/)   >   this file   >   service application.yml
#
# A key set here cannot be overridden from a service's own application.yml (that copy is
# dead); override it per environment in Deployment/. This header said the opposite until
# 2026-10-17.
#
# Put something here only if it is genuinely the same for EVERY service and is
# not environment-dependent. Deliberately excluded, and why:
#   spring.flyway.*        - tests disable it; enabling it here ran Postgres DDL against H2
#   spring.jpa...dialect   - ONDCIntegrationService is on ClickHouse, not Postgres
#   kafka (de)serializers  - services legitimately differ (String / Json / ErrorHandling)
#   openfeign.circuitbreaker.* - turning it on requires every Feign `fallback` bean to
#                                exist; imposing it broke ONDCIntegrationService
#   logging.pattern.level      - interacts with each service's logback-spring.xml
#   datasource, server.port, spring.application.name - service identity
#   hosts, URLs, credentials - environment; those belong in Deployment/.
# ---------------------------------------------------------------------------

spring:
  main:
    allow-bean-definition-overriding: true
  kafka:
    # Micrometer tracing across producer/consumer boundaries.
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
  cloud:
    # No load-balancer retry. spring-retry reaches every service through spring-kafka, which switched
    # Spring Cloud LoadBalancer's retry on by default: a GET that timed out was sent a second time to
    # the same (only) instance, so a slow callee got twice the load and connect + 2 x read ran past
    # the time limiter. Measured 2026-10-17 with a WireMock hop test: 2 requests per timed-out call,
    # 1 with this off. Feign itself never retries (Retryer.NEVER_RETRY).
    loadbalancer:
      retry:
        enabled: false
    openfeign:
      client:
        config:
          # connect + read must stay below resilience4j.timelimiter's timeoutDuration (3 s,
          # below): with the Feign circuit breaker on, the limiter cancels the call first and
          # these never apply. FoodDeliveryContracts/validate_feign_timeouts.py checks it in
          # the layered config each service runs.
          default:
            connectTimeout: 500
            readTimeout: 2000

eureka:
  instance:
    # Canonical spelling. Relaxed binding accepts preferIpAddress too, but the
    # repo had both spellings in different files; standardise on kebab-case.
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      validate-group-membership: false
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    liveness:
      include: livenessState,ping
    readiness:
      include: readinessState,db,redis,indexBootstrap
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
  timelimiter:
    configs:
      default:
        timeoutDuration: 3s
